apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pulld.fullname" . }}-health-test"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulld.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: "{{ .Values.test.image.repository }}:{{ .Values.test.image.tag }}"
      imagePullPolicy: {{ .Values.test.image.pullPolicy }}
      command:
        - wget
      args:
        - -qO-
        - "http://{{ include "pulld.fullname" . }}:{{ .Values.service.port }}/health"
