replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: ghcr.io/mkoyan44/pulld
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

cache:
  backend: filesystem
  dir: /var/lib/pulld/cache

s3:
  endpoint: ""
  bucket: pulld-cache
  region: us-east-1
  forcePathStyle: true
  scratchDir: /tmp/pulld-cache
  prefix: ""
  existingSecret: ""
  accessKeyIdKey: MINIO_ROOT_USER
  secretAccessKeyKey: MINIO_ROOT_PASSWORD

extraArgs: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

service:
  type: ClusterIP
  port: 5050
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: pulld.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  storageClassName: ""
  annotations: {}

probes:
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  ingress:
    - {}
  egress:
    - {}

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
runtimeClassName: ""
terminationGracePeriodSeconds: 30

test:
  enabled: false
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
